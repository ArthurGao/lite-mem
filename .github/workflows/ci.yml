name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_PASSWORD: ci-only-pw-7f3k
          POSTGRES_DB: lite_mem
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LITEMEM_TEST_DATABASE_URL: postgresql://postgres:ci-only-pw-7f3k@localhost:5432/lite_mem
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-extras
      - run: uv run ruff check && uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  # The image deploy/compose.yaml runs. Built in CI so a broken image cannot go unnoticed
  # (llm-steward's lesson); the compose file is parsed with the template env.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lite-mem:ci .
      - name: the image runs (imports the server, the CLI starts)
        run: |
          docker run --rm lite-mem:ci python -c "import lite_mem.server.app"
          docker run --rm lite-mem:ci litemem serve --help
      - run: |
          printf 'POSTGRES_PASSWORD=ci\nLITEMEM_SERVER__API_KEYS=[]\n' > ci.env
          docker compose -f deploy/compose.yaml --env-file ci.env config -q
