[project]
name = "lite-mem"
version = "0.1.0"
description = "A small memory engine for AI agents: fact extraction, conflict resolution, history, hybrid search"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "typer==0.27.3",
    "jinja2==3.1.6",
    "jieba==0.42.1",
    # The store (design §4). Pinned exactly, like lite-rag: an upgrade re-runs `-m ollama` and the eval.
    "psycopg[binary,pool]==3.3.8",
    "httpx2==2.16.0",
    "openai==3.46.0",
]

[project.scripts]
litemem = "lite_mem.cli:app"

[project.optional-dependencies]
anthropic = [
    "anthropic==2.6.0",
]
# The embedded store (S7b): one SQLite file, no server.
sqlite = [
    "sqlite-vec==0.1.9",
]
server = [
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
]
# The comparison system for `litemem eval --mem0` (design §8); the version llm-steward pins.
eval = [
    "mem0ai==2.2.1",
    "ollama==0.6.3",  # mem0 imports it for its ollama embedder, without declaring it
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx==0.28.1",  # FastAPI's TestClient (the server extra, S6)
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
# Full-width punctuation is intentional: Chinese text and prompts.
allowed-confusables = ["：", "（", "）", "！", "？", "，", "；", "。"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
packages = ["lite_mem"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["jieba", "mem0", "mem0.*", "sqlite_vec"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Opt-in, deselected by default: `-m ollama` (the real Ollama server on the host).
addopts = "-m 'not ollama'"
# jieba 0.42.1 (unmaintained upstream) has invalid escapes in its own regexes; nothing else.
filterwarnings = ["ignore::SyntaxWarning:jieba.*"]
markers = [
    "ollama: talks to the real Ollama server (opt-in: uv run pytest -m ollama)",
]
